<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meganathan – Computer Service Engineer, Coimbatore</title>
<meta name="description" content="Computer service engineer with 6 years in hardware, networking, printers and CCTV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1722;--panel:#12263a;--line:#23405c;--tx:#e8eef4;--mut:#8ea3b7;--cable:#ff8a3d;--blue:#5fb4ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 17px/1.65 Sora,system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--cable);outline-offset:3px}
.mono{font-family:"IBM Plex Mono",monospace}
nav{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:linear-gradient(var(--bg),transparent)}
nav b{font-weight:800;letter-spacing:.02em}
nav div a{margin-left:22px;text-decoration:none;color:var(--mut);font-size:15px}
nav div a:hover{color:var(--cable)}
#hero{position:relative;min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding:90px 5vw 40px;overflow:hidden}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#hero>div{position:relative;z-index:1}
h1{font-size:clamp(44px,7.5vw,96px);line-height:1;font-weight:800;letter-spacing:-.03em}
.role{margin:18px 0 8px;font-size:clamp(18px,2.4vw,26px);color:var(--blue)}
.term{margin-top:22px;max-width:520px;background:#08111a;border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:14px;color:var(--mut);min-height:132px}
.term i{color:var(--cable);font-style:normal}.term em{color:#7be0a3;font-style:normal}
.cur{display:inline-block;width:8px;height:15px;background:var(--cable);vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:4px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--cable);transition:transform .2s}
.btn.p{background:var(--cable);color:#1a0d02}.btn:hover{transform:translateY(-3px)}
.card3d{perspective:900px;justify-self:center}
.card3d .in{width:min(300px,70vw);aspect-ratio:520/736;border-radius:8px;overflow:hidden;border:2px solid var(--cable);box-shadow:0 30px 60px #000a,0 0 0 8px #ff8a3d22;transform-style:preserve-3d;transition:transform .15s;position:relative;animation:float 6s ease-in-out infinite}
.card3d img{width:100%;height:100%;object-fit:cover;display:block}
.card3d .tag{position:absolute;left:10px;bottom:10px;background:#08111acc;border:1px solid var(--line);padding:4px 10px;border-radius:3px;font-size:12px;color:#7be0a3;transform:translateZ(40px)}
@keyframes float{50%{translate:0 -10px}}
section{padding:90px 5vw;max-width:1100px;margin:auto}
h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;margin-bottom:28px}
.lead{max-width:62ch;color:#c5d2de}
.stats{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
.stats b{display:block;font-size:42px;color:var(--cable);line-height:1}
.stats span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;perspective:1000px}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;transition:transform .25s,border-color .25s;transform-style:preserve-3d}
.sk:hover{transform:rotateX(8deg) rotateY(-8deg) translateZ(14px);border-color:var(--cable)}
.sk svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.6;margin-bottom:10px}
.sk h3{font-size:17px;margin-bottom:4px}.sk p{font-size:14px;color:var(--mut);line-height:1.5}
.tl{border-left:2px solid var(--line);padding-left:28px;display:grid;gap:34px}
.job{position:relative}
.job:before{content:"";position:absolute;left:-37px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--cable)}
.job.now:before{background:var(--cable);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff8a3d88}100%{box-shadow:0 0 0 14px #ff8a3d00}}
.job h3{font-size:21px}.job .m{color:var(--blue);font-size:14px;margin:2px 0 10px}
.job li{color:#c5d2de;margin-left:18px;font-size:15.5px}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.edu div{border:1px solid var(--line);border-radius:6px;padding:18px}.edu b{color:var(--cable)}
.edu span{display:block;color:var(--mut);font-size:14px}
.contact a{display:block;font-size:clamp(20px,3.4vw,34px);font-weight:600;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line);transition:padding .2s,color .2s}
.contact a:hover{padding-left:14px;color:var(--cable)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.rv.on{opacity:1;transform:none}
@media(max-width:800px){#hero{grid-template-columns:1fr;padding-top:100px}.card3d{order:-1}nav div a:nth-child(n+3){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--cable);z-index:9;box-shadow:0 0 10px var(--cable)}
#glow{position:fixed;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(#ff8a3d1f,transparent 65%);left:-999px;top:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font:500 14px "IBM Plex Mono",monospace;background:none;color:var(--mut);border:1px solid var(--line);padding:9px 16px;border-radius:4px;cursor:pointer;transition:.2s}
.tabs button.on,.tabs button:hover{color:#1a0d02;background:var(--cable);border-color:var(--cable)}
.pane{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;animation:pin .4s}
.pane.on{display:block}@keyframes pin{from{opacity:0;transform:rotateX(-12deg) translateY(10px)}}
.pane p{color:#c5d2de;margin-bottom:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{font:13px "IBM Plex Mono",monospace;border:1px solid var(--blue);color:var(--blue);padding:4px 12px;border-radius:20px;transition:.2s}
.chips span:hover{background:var(--blue);color:#06121c;transform:translateY(-3px)}
#diag{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;font:14px "IBM Plex Mono",monospace;color:var(--mut)}
#diag li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0}
#diag li.ok{color:#7be0a3}#diag li.ok b:after{content:" OK"}
#run{margin-top:22px;cursor:pointer;background:none;color:var(--tx);font:inherit;font-size:15px;font-weight:600}
.jr{display:grid;gap:0}
.jr div{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.jr b{color:var(--cable);font-family:"IBM Plex Mono",monospace}.jr span{color:#c5d2de}
.jr div:hover{background:linear-gradient(90deg,#ff8a3d14,transparent)}
.term{padding:0!important;overflow:hidden;max-width:620px!important;background:#08111aee!important;min-height:0!important}
.term a{color:var(--blue)}
.tbar{display:flex;gap:7px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.tbar i{width:10px;height:10px;border-radius:50%;background:#ff5f56}.tbar i:nth-child(2){background:#ffbd2e}.tbar i:nth-child(3){background:#27c93f}
#scr{height:260px;overflow-y:auto;padding:12px 14px;color:var(--tx);font-size:13.5px;line-height:1.55}
.l{animation:in .25s both;word-break:break-word}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.pr{color:#7be0a3}.pr b{color:var(--cable);font-weight:500}.m{color:var(--mut)}.h{color:var(--cable);font-weight:600}.ok{color:#7be0a3}.er{color:#ff6b6b}
.k{display:grid;grid-template-columns:110px 1fr;gap:2px 12px;margin:4px 0}.k>*:nth-child(odd){color:var(--blue)}
ul.t{list-style:none;padding:0}ul.t li:before{content:"▸ ";color:var(--cable)}
.tg{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:20px;padding:0 9px;margin:2px 4px 2px 0;font-size:12px}
.cmd{color:var(--cable);cursor:pointer;text-decoration:underline dotted}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line);scrollbar-width:none}
#chips button{flex:none;font:inherit;font-size:12px;background:none;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
#chips button:hover{color:#1a0d02;background:var(--cable);border-color:var(--cable)}
#tin{display:flex;gap:8px;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
#tin label{color:#7be0a3;white-space:nowrap;font-size:13.5px}#tin label b{color:var(--cable);font-weight:500}
#cmd{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;caret-color:var(--cable);outline:0}
@media(max-width:560px){.k{grid-template-columns:1fr}#tin label span{display:none}}
</style>
</head>
